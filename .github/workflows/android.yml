# Builds the native Android app (app-android/) on every push to the Android branch.
# Success: the APK goes to the pre-release "android-latest". Either way the build log and the result go to
# the branch "ci-report" (build.log, status.txt), so they can be read without the Actions UI.
name: android
on:
  push:
    branches: [Android]
    paths: ["app-android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Native libraries and voices
        run: sh app-android/fetch-native.sh
      - name: Build
        shell: bash
        working-directory: app-android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee build.log
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-android/app/build/outputs/apk/release/app-release.apk EdiKOla-android.apk
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest EdiKOla-android.apk --prerelease --target "${{ github.sha }}" \
            --title "EdiKOla per Android ($(git rev-parse --short HEAD))" \
            --notes "App nativa EdiKOla, compilata dal branch Android. Apri questa pagina dal telefono e scarica EdiKOla-android.apk."
      - name: Report
        if: always()
        run: |
          mkdir -p /tmp/r
          cp app-android/build.log /tmp/r/build.log 2>/dev/null || echo "no build log" > /tmp/r/build.log
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/r/status.txt
          git config user.name "edikola-ci"
          git config user.email "edikola-ci@users.noreply.github.com"
          git checkout -q --orphan ci-report
          git rm -rf -q . || true
          cp /tmp/r/build.log /tmp/r/status.txt .
          git add build.log status.txt
          git commit -q -m "CI report ${{ github.sha }}"
          git push -q -f origin ci-report
