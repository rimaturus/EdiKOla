# Builds the native Android app (app-android/) on every push to the Android branch.
# Success: the APK goes to the pre-release "android-latest". Either way the build log and the result go to
# the branch "ci-report" (build.log, status.txt), so they can be read without the Actions UI.
name: android
on:
  push:
    branches: [Android]
    paths: ["app-android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Native libraries and voices
        run: sh app-android/fetch-native.sh
      - name: Build
        shell: bash
        working-directory: app-android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee build.log
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-android/app/build/outputs/apk/release/app-release.apk EdiKOla-android.apk
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest EdiKOla-android.apk --prerelease --target "${{ github.sha }}" \
            --title "EdiKOla per Android ($(git rev-parse --short HEAD))" \
            --notes "App nativa EdiKOla, compilata dal branch Android. Apri questa pagina dal telefono e scarica EdiKOla-android.apk."
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on an emulator (screenshots and log into ci-report)
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash app-android/ci-smoke.sh EdiKOla-android.apk smoke
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r
          cp app-android/build.log /tmp/r/build.log 2>/dev/null || echo "no build log" > /tmp/r/build.log
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/r/status.txt
          if [ -d smoke ]; then cp -r smoke /tmp/r/; fi
          cd /tmp/r
          git init -q
          git checkout -q -b ci-report
          git config user.name "edikola-ci"
          git config user.email "edikola-ci@users.noreply.github.com"
          git add -A .
          git commit -q -m "CI report ${{ github.sha }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-report
